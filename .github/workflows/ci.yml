name: CI Pipeline - Carteira Estudante

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-infra:
    name: Testa a Infraestrutura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Testa o Build dos Contêineres
        run: docker compose build

      - name: Checa sintaxe do Python
        run: |
          pip install flake8
          flake8 ./backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Checa sintaxe do Next.js
        run: |
          cd frontend
          npm install
          npm run lint --if-present

      - name: Executa Testes do Backend
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest httpx
          pytest

      - name: Build da Imagem Docker
        run: docker build -t carteira-backend:latest ./backend

      - name: Análise de Segurança da Imagem
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'carteira-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'