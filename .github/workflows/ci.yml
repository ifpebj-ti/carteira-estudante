name: CI Pipeline - Carteira Estudante

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:
    branches: ["main"]
  workflow_call:
    inputs:
      release_tag:
        description: "Tag SemVer gerada pelo Release Please"
        required: false
        type: string

permissions:
  contents: write
  packages: write
  issues: write

jobs:
  build-infra:
    name: Testa a Infraestrutura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Criar arquivo .env para testes da CI
        run: cp .env.example .env

      - name: Configura QEMU (Suporte Multi-arquitetura)
        uses: docker/setup-qemu-action@v4

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build da Imagem do Backend (Local + Cache)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          pull: true
          load: true
          tags: carteira-estudante-backend:latest,carteira-backend:latest
          build-args: |
            CACHE_BUSTER=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ github.workflow }}-backend-trivy
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-backend-trivy

      - name: Inicia os Contêineres (Sem Build)
        run: docker compose up -d --no-build db backend

      - name: Aguarda Banco de Dados
        run: sleep 10

      - name: Checa qualidade do Python (Ruff)
        run: docker compose exec backend ruff check .

      - name: SAST - Segurança Estática (Bandit)
        run: docker compose exec backend bandit -r app/ -ll -ii

      - name: Configura Node.js e Cache NPM
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Checa sintaxe do Next.js
        run: |
          cd frontend
          npm ci
          npm run lint --if-present

      - name: Executa Testes do Backend
        run: docker compose exec -T backend pytest --cov=app --cov-branch --cov-report=xml:coverage.xml --cov-fail-under=70

      - name: Gera Badges de Cobertura (Lines e Branches)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker compose exec -T backend cat coverage.xml > coverage.xml
          pip install anybadge
          mkdir -p badges
          LINES=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['line-rate']) * 100, 1))")
          BRANCHES=$(python3 -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().attrib['branch-rate']) * 100, 1))")
          anybadge --label="coverage-lines" --value=$LINES --suffix="%" --file=badges/coverage-lines.svg 50=red 70=orange 85=yellow 100=green
          anybadge --label="coverage-branches" --value=$BRANCHES --suffix="%" --file=badges/coverage-branches.svg 50=red 70=orange 85=yellow 100=green

      - name: Publica Badges na branch badges
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: ./badges

      - name: Prepara dados fictícios e token autenticado para o ZAP
        id: zap_auth
        run: |
          docker compose exec -T -e ENVIRONMENT=test -e SEED_DEFAULT_PASSWORD=CiZapTestPass123! backend python scripts/seed_db.py
          TOKEN=$(curl -fsS -X POST http://localhost:8000/api/v1/auth/login \
            -H "Content-Type: application/json" \
            -d '{"login":"admin_teste","senha":"CiZapTestPass123!"}' | python3 -c "import sys, json; print(json.load(sys.stdin)['access_token'])")
          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: DAST - OWASP ZAP Baseline Scan (Backend Autenticado)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:8000"
          fail_action: true
          allow_issue_writing: false
          rules_file_name: '.zap/rules.tsv'
          cmd_options: >-
            -z "-config replacer.full_list(0).description=auth
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Authorization
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=Bearer ${{ steps.zap_auth.outputs.token }}"

      - name: Análise de Segurança da Imagem (Trivy - Backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "carteira-backend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepara nome do repositório
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extrai metadados (tags, labels) para o Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/carteira-backend
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ inputs.release_tag }},enable=${{ inputs.release_tag != '' }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build Multi-arquitetura e Push para GHCR (Backend)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CACHE_BUSTER=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ github.workflow }}-backend-push
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-backend-push

      - name: Extrai metadados para o Frontend
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.REPO_OWNER }}/carteira-frontend
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}

      - name: Build da Imagem do Frontend (Local + Cache para Trivy)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          pull: true
          load: true
          tags: carteira-estudante-frontend:latest,carteira-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            CACHE_BUSTER=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ github.workflow }}-frontend-trivy
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-frontend-trivy

      - name: Análise de Segurança (Trivy) - Frontend
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "carteira-frontend:latest"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      - name: Sobe contêiner do Frontend para DAST
        run: |
          docker compose up -d --no-build frontend
          for i in $(seq 1 15); do
            if curl -fsS -o /dev/null http://localhost:3000; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: DAST - OWASP ZAP Baseline Scan (Frontend)
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://localhost:3000"
          fail_action: true
          allow_issue_writing: false
          rules_file_name: '.zap/rules.tsv'

      - name: Build Multi-arquitetura e Push para GHCR - Frontend
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            CACHE_BUSTER=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=${{ github.workflow }}-frontend-push
          cache-to: type=gha,mode=max,scope=${{ github.workflow }}-frontend-push

  deploy-prod:
    name: CD - Deploy na Oracle VM
    runs-on: ubuntu-latest
    needs: build-infra
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    steps:
      - name: Conectar via SSH e atualizar contêineres
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USERNAME }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/carteira-estudante
            sudo docker compose -f docker-compose.prod.yml pull
            sudo docker compose -f docker-compose.prod.yml up -d
            sudo docker image prune -f
