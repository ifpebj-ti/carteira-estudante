name: CI Pipeline - Carteira Estudante

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

jobs:
  build-infra:
    name: Testa a Infraestrutura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Testa o Build dos Contêineres
        run: docker compose build

      - name: Inicia os Contêineres
        run: docker compose up -d db backend

      - name: Aguarda Banco de Dados
        run: sleep 10

      - name: Checa qualidade do Python (Ruff)
        run: docker compose exec backend ruff check .

      - name: Checa sintaxe do Next.js
        run: |
          cd frontend
          npm install
          npm run lint --if-present

      - name: Executa Testes do Backend
        run: docker compose exec backend pytest

      - name: Build da Imagem Docker
        run: docker build -t carteira-backend:latest ./backend

      - name: Análise de Segurança da Imagem
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'carteira-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push da Imagem para o GHCR
        run: |
          # Transforma o nome do dono do repositório em minúsculas (exigência do Docker)
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          
          # Tagueia e envia a imagem
          docker tag carteira-backend:latest ghcr.io/$REPO_OWNER/carteira-backend:latest
          docker push ghcr.io/$REPO_OWNER/carteira-backend:latest