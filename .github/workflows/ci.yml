name: CI Pipeline - Carteira Estudante

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write
  issues: write

jobs:
  build-infra:
    name: Testa a Infraestrutura
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v7

      - name: Testa o Build dos Contêineres
        run: docker compose build

      - name: Inicia os Contêineres
        run: docker compose up -d db backend

      - name: Aguarda Banco de Dados
        run: sleep 10

      - name: Checa qualidade do Python (Ruff)
        run: docker compose exec backend ruff check .

      - name: SAST - Segurança Estática (Bandit)
        run: |
          pip install bandit
          bandit -r backend/app/ -ll -ii

      - name: Checa sintaxe do Next.js
        run: |
          cd frontend
          npm install
          npm run lint --if-present

      - name: Executa Testes do Backend
        run: docker compose exec backend pytest

      - name: DAST - OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: 'http://localhost:8000'
          fail_action: false
          allow_issue_writing: false

      - name: Configura QEMU (Suporte Multi-arquitetura)
        uses: docker/setup-qemu-action@v5

      - name: Configura Docker Buildx
        uses: docker/setup-buildx-action@v5

      - name: Build da Imagem (Local) para o Trivy
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true 
          tags: carteira-backend:latest

      - name: Análise de Segurança da Imagem
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'carteira-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
      
      - name: Login no GitHub Container Registry
        uses: docker/login-action@v5
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepara nome do repositório
        run: echo "REPO_OWNER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build Multi-arquitetura e Push para GHCR
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/carteira-backend:latest