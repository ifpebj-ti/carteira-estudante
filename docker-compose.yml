services:
  # 1. Banco de Dados
  db:
    image: postgres:15-alpine
    container_name: carteira_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: carteira_estudante
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Back-end
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: carteira_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://admin:admin123@db:5432/carteira_estudante
    depends_on:
      - db
    volumes:
      - ./backend:/app

  # 3. Front-end
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carteira_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data: